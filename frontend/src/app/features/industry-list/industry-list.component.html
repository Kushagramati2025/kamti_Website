<div class="bg-white py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-brand-dark sm:text-4xl">Industries We Serve</h2>
            <p class="mt-4 max-w-2xl text-xl text-gray-500 mx-auto">
                Specialized solutions for diverse market sectors.
            </p>
        </div>

        <div *ngIf="loading" class="mt-12 flex justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
        </div>

        <div *ngIf="!loading" class="mt-12 grid gap-5 max-w-lg mx-auto lg:grid-cols-3 lg:max-w-none">
            <div *ngFor="let industry of industries"
                class="flex flex-col rounded-lg shadow-lg overflow-hidden transition-transform duration-300 hover:scale-105">
                <div class="flex-shrink-0">
                    <img class="h-48 w-full object-cover"
                        [src]="apiService.getImageUrl(industry.banner_image) || 'assets/placeholder.jpg'"
                        [alt]="industry.name">
                </div>
                <div class="flex-1 bg-white p-6 flex flex-col justify-between">
                    <div class="flex-1">
                        <a [routerLink]="['/industries', industry.slug]" class="block mt-2">
                            <p class="text-xl font-semibold text-brand-dark hover:text-primary transition-colors">{{
                                industry.name }}</p>
                            <p class="mt-3 text-base text-gray-500">{{ industry.description }}</p>
                        </a>
                    </div>
                    <div class="mt-6 flex items-center">
                        <a [routerLink]="['/industries', industry.slug]"
                            class="text-primary hover:text-secondary font-medium">
                            Learn more &rarr;
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
