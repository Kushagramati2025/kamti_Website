<div class="flex flex-col h-full w-full bg-white">

    <!-- Tabs Navigation -->
    <div class="w-full bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-center space-x-12 overflow-x-auto">
                <button *ngFor="let tab of tabs" (click)="setActiveTab(tab)"
                    [class.border-brand-purple]="activeTab === tab" [class.text-shimmer-purple]="activeTab === tab"
                    [class.font-black]="activeTab === tab" [class.text-gray-500]="activeTab !== tab"
                    class="group relative inline-flex items-center px-6 py-4 border-b-4 border-transparent hover:text-brand-purple hover:border-brand-purple/50 transition-all duration-200 text-xl font-bold cursor-pointer outline-none whitespace-nowrap">
                    {{ tab }}
                </button>
            </div>
        </div>
    </div>

    <!-- Content Area -->
    <div
        class="flex-grow relative w-full bg-white overflow-y-auto flex items-start justify-center min-h-[600px] p-8 md:p-12">

        <!-- Tab 1: Kusha at glance -->
        <div *ngIf="activeTab === 'Kusha at glance'"
            class="w-full max-w-7xl animate-fade-in-up flex justify-center perspective-1000">
            <div class="relative group transition-all duration-500 transform hover:-translate-y-2">
                <img src="http://localhost:8000/media/service/Kusha at glance.avif" alt="Kusha at Glance"
                    class="w-full h-auto object-contain transition-transform duration-700 group-hover:scale-[1.01]">
            </div>
        </div>

        <!-- Tab 2: Application Services -->
        <div *ngIf="activeTab === 'Application Services'"
            class="w-full max-w-7xl animate-fade-in-up flex justify-center perspective-1000">
            <div class="relative group transition-all duration-500 transform hover:-translate-y-2">
                <img src="http://localhost:8000/media/service/Application Services.avif" alt="Application Services"
                    class="w-full h-auto object-contain transition-transform duration-700 group-hover:scale-[1.01]">
            </div>
        </div>

        <!-- Tab 3: Data Analytics -->
        <div *ngIf="activeTab === 'Data Analytics'"
            class="w-full max-w-7xl animate-fade-in-up flex justify-center perspective-1000">
            <div class="relative group transition-all duration-500 transform hover:-translate-y-2">
                <img src="http://localhost:8000/media/service/data analytics info.avif" alt="Data Analytics"
                    class="w-full h-auto object-contain transition-transform duration-700 group-hover:scale-[1.01]">
            </div>
        </div>

        <!-- Tab 4: Embedded-consultancy -->
        <div *ngIf="activeTab === 'Embedded-consultancy'"
            class="w-full max-w-7xl animate-fade-in-up flex justify-center perspective-1000">
            <div class="relative group transition-all duration-500 transform hover:-translate-y-2">
                <img src="http://localhost:8000/media/service/Embedded-consultancy.avif" alt="Embedded Consultancy"
                    class="w-full h-auto object-contain transition-transform duration-700 group-hover:scale-[1.01]">
            </div>
        </div>

    </div>
</div>
