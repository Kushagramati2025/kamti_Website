<div class="bg-gray-50 min-h-screen pt-16 pb-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Back Link -->
        <a routerLink="/tools-resources"
            class="inline-flex items-center text-brand-orange hover:text-brand-orange-dark mb-6 font-medium transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Tools & Resources
        </a>

        <div *ngIf="loading()" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-orange mx-auto"></div>
            <p class="mt-4 text-gray-500">Loading tool details...</p>
        </div>

        <div *ngIf="tool()" class="bg-white rounded-2xl shadow-xl overflow-hidden animate-fadeIn">
            <!-- Header/Banner -->
            <div class="bg-brand-orange/10 p-8 text-center border-b border-orange-100">
                <div class="w-16 h-16 bg-white rounded-xl shadow-sm flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z">
                        </path>
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-gray-900 sm:text-4xl" [innerHTML]="tool().title"></h1>
            </div>

            <div class="p-8">
                <!-- Content -->
                <div class="prose prose-lg prose-brand max-w-none text-gray-600 space-y-6"
                    [innerHTML]="tool().content || tool().description">
                </div>

                <!-- CTA -->
                <div class="mt-10 pt-8 border-t border-gray-100 text-center">
                    <p class="text-gray-500 mb-6 font-medium">Interested in learning more about this tool?</p>
                    <a [href]="getMailToLink(tool())"
                        class="inline-flex justify-center items-center rounded-xl shadow-lg px-8 py-4 bg-gradient-to-r from-brand-orange to-red-500 text-lg font-bold text-white hover:from-brand-orange-dark hover:to-red-600 focus:outline-none transform hover:scale-105 transition-all duration-300">
                        Request Info
                        <svg class="ml-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                            </path>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <div *ngIf="!loading() && !tool()" class="text-center py-12">
            <p class="text-gray-500 text-lg">Tool not found.</p>
        </div>
    </div>
</div>
