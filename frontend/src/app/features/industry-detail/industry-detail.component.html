<div *ngIf="loading" class="min-h-screen flex justify-center items-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
</div>

<div *ngIf="!loading && industry" class="bg-white">
    <!-- Banner -->
    <div class="relative bg-brand-purple">
        <div class="absolute inset-0">
            <img class="w-full h-full object-cover opacity-50"
                [src]="getImageUrl(industry.banner_image) || 'assets/placeholder.jpg'" alt="">
        </div>
        <div class="relative max-w-7xl mx-auto py-24 px-4 sm:py-32 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl lg:text-6xl">{{ industry.name }}
            </h1>
            <p class="mt-6 text-xl text-gray-300 max-w-3xl">{{ industry.description }}</p>
        </div>
    </div>

    <!-- Content Sections -->
    <div class="max-w-7xl mx-auto py-16 px-4 sm:px-6 lg:px-8">

        <!-- Our Services Header -->
        <div class="mb-16 border-b border-gray-100 pb-6">
            <h2 class="text-3xl font-bold text-gray-900 border-l-4 border-brand-purple pl-4">Our Services</h2>
        </div>

        <div *ngIf="industry.sections && industry.sections.length > 0; else noSections">
            <div *ngFor="let section of industry.sections; let i = index"
                class="flex flex-col lg:flex-row gap-16 mb-20 group animate-fade-in-up"
                [style.animation-delay]="(i * 150) + 'ms'">

                <!-- Image Container -->
                <div class="w-full lg:w-1/2 flex-shrink-0 relative max-w-xl mx-auto lg:mx-0"
                    [class.lg:order-last]="i % 2 !== 0">
                    <div class="relative overflow-hidden rounded-2xl shadow-2xl h-64 sm:h-72 lg:h-80">
                        <img *ngIf="section.image"
                            class="w-full h-full object-cover transform transition-transform duration-700 group-hover:scale-105"
                            [src]="getImageUrl(section.image)" [alt]="section.title">
                        <div *ngIf="!section.image"
                            class="w-full h-full bg-gray-50 flex items-center justify-center text-gray-400 border-2 border-dashed border-gray-200">
                            <span class="text-sm font-medium">No Image</span>
                        </div>
                        <!-- Overlay shine effect -->
                        <div
                            class="absolute inset-0 bg-gradient-to-tr from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                        </div>
                    </div>
                </div>

                <!-- Content Container -->
                <div class="w-full lg:w-1/2 flex flex-col justify-center">
                    <h3
                        class="text-3xl font-bold text-brand-dark mb-6 group-hover:text-brand-purple transition-colors duration-300">
                        {{ section.title }}
                    </h3>
                    <div class="prose prose-lg text-gray-600 leading-relaxed" [innerHTML]="section.content"></div>
                </div>
            </div>
        </div>
        <ng-template #noSections>
            <div class="text-center text-gray-500 py-10">
                <p>Specific details for this industry are coming soon.</p>
            </div>
        </ng-template>
    </div>
</div>
