<div *ngIf="loading" class="min-h-screen flex justify-center items-center">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary"></div>
</div>

<div *ngIf="!loading && industry" class="bg-white">
    <!-- Banner -->
    <div class="relative bg-brand-purple">
        <div class="absolute inset-0">
            <img class="w-full h-full object-cover opacity-50"
                [src]="getImageUrl(industry.banner_image) || 'assets/placeholder.jpg'" alt="">
        </div>
        <div class="relative max-w-7xl mx-auto py-4 px-4 sm:py-6 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl lg:text-6xl">{{ industry.name }}
            </h1>
            <p class="mt-4 text-xl text-gray-300 max-w-3xl">{{ industry.description }}</p>
        </div>
    </div>

    <!-- Content Sections -->
    <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">

        <!-- Our Services Header -->
        <div class="mb-4 border-b border-gray-100 pb-4">
            <h2 class="text-3xl font-bold text-gray-900 border-l-4 border-brand-purple pl-4">Our Services</h2>
        </div>

        <div *ngIf="industry.sections && industry.sections.length > 0; else noSections">
            <div *ngFor="let section of industry.sections; let i = index"
                class="flex flex-col lg:flex-row gap-6 mb-8 group animate-fade-in-up"
                [style.animation-delay]="(i * 150) + 'ms'">

                <!-- Image Container -->
                <div class="w-full lg:w-2/5 flex-shrink-0 relative max-w-md mx-auto lg:mx-0"
                    [class.lg:order-last]="i % 2 !== 0">
                    <div class="relative overflow-hidden rounded-2xl shadow-2xl h-48 sm:h-56 lg:h-64">
                        <img *ngIf="section.image"
                            class="w-full h-full object-cover transform transition-transform duration-700 group-hover:scale-105"
                            [src]="getImageUrl(section.image)" [alt]="section.title">
                        <div *ngIf="!section.image"
                            class="w-full h-full bg-gray-50 flex items-center justify-center text-gray-400 border-2 border-dashed border-gray-200">
                            <span class="text-sm font-medium">No Image</span>
                        </div>
                        <!-- Overlay shine effect -->
                        <div
                            class="absolute inset-0 bg-gradient-to-tr from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                        </div>
                    </div>
                </div>

                <!-- Content Container -->
                <div class="w-full lg:w-3/5 flex flex-col justify-center">
                    <h3
                        class="text-3xl font-bold text-brand-dark mb-6 group-hover:text-brand-purple transition-colors duration-300">
                        {{ section.title }}
                    </h3>
                    <div class="prose prose-lg text-gray-600 leading-relaxed" [innerHTML]="section.content"></div>
                </div>
            </div>
        </div>

        <!-- Case Study Section (Restored & Updated to MailTo) -->
        <div *ngIf="industry.case_study" class="mt-6 border-t border-gray-100 pt-4">
            <div
                class="bg-gray-50 rounded-3xl p-8 lg:p-12 shadow-sm border border-gray-100 flex flex-col lg:flex-row gap-12 items-center">
                <!-- Case Study Image -->
                <div class="w-full lg:w-2/5">
                    <div class="relative rounded-2xl overflow-hidden shadow-lg group">
                        <img *ngIf="industry.case_study.image" [src]="industry.case_study.image"
                            class="w-full h-auto transform transition-transform duration-500 group-hover:scale-105"
                            alt="Case Study">
                        <!-- Fallback if no image -->
                        <div *ngIf="!industry.case_study.image"
                            class="w-full h-64 bg-gray-200 flex items-center justify-center text-gray-400">
                            <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                                </path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Case Study Content -->
                <div class="w-full lg:w-3/5">
                    <div
                        class="inline-block px-4 py-1 rounded-full bg-brand-orange/10 text-brand-orange text-sm font-bold uppercase tracking-wide mb-6">
                        Case Study
                    </div>
                    <h3 class="text-3xl font-extrabold text-gray-900 mb-6">
                        {{ industry.case_study.title }}
                    </h3>
                    <p class="text-lg text-gray-600 mb-8 leading-relaxed">
                        {{ industry.case_study.description }}
                    </p>
                    <a [href]="getMailToLink(industry.case_study.title)"
                        class="inline-flex items-center px-8 py-4 border border-transparent text-base font-bold rounded-lg text-white bg-brand-orange hover:bg-brand-orange-dark shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                        REQUEST CASE STUDY
                        <svg class="ml-2 -mr-1 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                            </path>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <ng-template #noSections>
            <div class="text-center text-gray-500 py-10">
                <p>Specific details for this industry are coming soon.</p>
            </div>
        </ng-template>
    </div>
</div>
