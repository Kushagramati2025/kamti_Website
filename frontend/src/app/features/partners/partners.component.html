<div class="min-h-screen bg-gray-50 font-sans">
    <!-- Compact Hero Banner -->
    <!-- Compact Hero Banner -->
    <div class="relative w-full h-[180px] bg-gray-900 overflow-hidden group">
        <!-- Background Image -->
        <img src="assets/images/partners/banner.png"
            class="absolute inset-0 w-full h-full object-cover object-center opacity-90 transition-transform duration-700 group-hover:scale-105"
            alt="Partners Banner">
        <div class="absolute inset-0 bg-gradient-to-b from-brand-purple/40 to-brand-purple/70">
        </div>

        <!-- Integrated Navigation -->
        <div class="absolute bottom-0 left-0 right-0 z-20 border-t border-white/10 bg-white/5 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4">
                <nav class="flex flex-wrap justify-center md:justify-between items-center h-auto md:h-12 py-1">
                    <div class="flex flex-wrap justify-center gap-1 md:gap-2">
                        <a routerLink="/leadership" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Leadership</a>
                        <a routerLink="/partners" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Partners</a>
                        <a routerLink="/values" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Values</a>
                        <a routerLink="/vision-mission" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Vision
                            & Mission</a>
                        <a routerLink="/blog" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Blog</a>
                        <a routerLink="/contact" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Contact</a>
                    </div>
                </nav>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="w-full">
            <div class="text-center mb-12">
                <h2 class="text-3xl font-bold text-gray-900 uppercase tracking-tight">Our Trusted Partners</h2>
                <div class="w-24 h-1 bg-brand-orange mx-auto mt-4 rounded-full"></div>
                <!-- Optional Subtitle -->
                <!-- <p class="mt-4 text-xl text-gray-500">Collaborating with industry leaders to deliver the best solutions.</p> -->
            </div>

            <div *ngIf="loading" class="flex justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-brand-purple"></div>
            </div>

            <div *ngIf="!loading" class="grid grid-cols-2 gap-8 md:grid-cols-3 lg:grid-cols-4">
                <div *ngFor="let partner of partners"
                    class="group relative bg-white p-8 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 flex items-center justify-center h-48">
                    <a [href]="partner.website" target="_blank"
                        class="block w-full h-full flex items-center justify-center p-4">
                        <img class="max-h-full max-w-full transition-all duration-500 transform group-hover:scale-110 object-contain"
                            [src]="getImageUrl(partner.logo) || 'assets/placeholder.jpg'" [alt]="partner.name">
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
