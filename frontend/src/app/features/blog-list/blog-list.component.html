<div class="min-h-screen bg-gray-50 font-sans">
    <!-- Compact Hero Banner -->
    <!-- Compact Hero Banner -->
    <div class="relative w-full h-[180px] bg-gray-900 overflow-hidden group">
        <!-- Background Image -->
        <img src="assets/images/blog/banner.png"
            class="absolute inset-0 w-full h-full object-cover object-center opacity-90 transition-transform duration-700 group-hover:scale-105"
            alt="Blog Banner">
        <div class="absolute inset-0 bg-gradient-to-b from-brand-purple/40 to-brand-purple/70">
        </div>

        <!-- Integrated Navigation -->
        <div class="absolute bottom-0 left-0 right-0 z-20 border-t border-white/10 bg-white/5 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4">
                <nav class="flex flex-wrap justify-center md:justify-between items-center h-auto md:h-12 py-1">
                    <div class="flex flex-wrap justify-center gap-1 md:gap-2">
                        <a routerLink="/leadership" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Leadership</a>
                        <a routerLink="/partners" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Partners</a>
                        <a routerLink="/values" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Values</a>
                        <a routerLink="/vision-mission" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Vision
                            & Mission</a>
                        <a routerLink="/blog" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Blog</a>
                        <a routerLink="/contact" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Contact</a>
                    </div>
                </nav>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <!-- Main Content Area -->
    <div class="max-w-7xl mx-auto py-16 px-4 sm:px-6 lg:px-8">
        <div class="w-full">
            <div class="text-center mb-20">
                <h2 class="text-3xl font-bold text-gray-900 uppercase tracking-tight">Latest Insights</h2>
                <div class="w-24 h-1 bg-brand-orange mx-auto mt-4 rounded-full"></div>
                <p class="mt-4 text-xl text-gray-500">News, updates, and thought leadership from our experts.</p>
            </div>

            <div *ngIf="loading" class="flex justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-brand-purple"></div>
            </div>

            <div *ngIf="!loading">
                <div *ngFor="let post of posts; let i = index"
                    class="flex flex-col lg:flex-row gap-12 lg:gap-20 mb-24 items-center group animate-fade-in-up"
                    [style.animation-delay]="(i * 150) + 'ms'">

                    <!-- Image Container -->
                    <div class="w-full lg:w-1/2 flex-shrink-0 relative max-w-2xl mx-auto lg:mx-0"
                        [class.lg:order-last]="i % 2 !== 0">
                        <div
                            class="relative overflow-hidden rounded-[2rem] shadow-2xl h-64 sm:h-80 lg:h-[400px] border-4 border-white/50">
                            <!-- Date Badge -->
                            <div class="absolute top-6 left-6 z-20">
                                <span
                                    class="bg-white/95 backdrop-blur-md text-brand-dark px-4 py-2 rounded-xl text-sm font-bold shadow-lg flex flex-col items-center border border-gray-100">
                                    <span class="text-2xl font-extrabold text-brand-orange leading-none">{{
                                        post.created_at | date:'dd' }}</span>
                                    <span class="text-xs uppercase tracking-wider text-gray-500">{{ post.created_at |
                                        date:'MMM' }}</span>
                                </span>
                            </div>

                            <div
                                class="absolute inset-0 bg-brand-purple/10 group-hover:bg-brand-purple/0 transition-colors duration-500 z-10">
                            </div>

                            <img class="w-full h-full object-cover transform transition-transform duration-700 group-hover:scale-110"
                                [src]="post.image ? post.image : 'assets/logo.avif'"
                                (error)="post.image = 'assets/logo.avif'" [alt]="post.title">
                        </div>

                        <!-- Decorative Blob -->
                        <div
                            class="absolute -bottom-10 -right-10 w-40 h-40 bg-brand-orange/20 rounded-full blur-3xl -z-10 group-hover:bg-brand-orange/30 transition-all duration-500">
                        </div>
                        <div
                            class="absolute -top-10 -left-10 w-40 h-40 bg-brand-purple/20 rounded-full blur-3xl -z-10 group-hover:bg-brand-purple/30 transition-all duration-500">
                        </div>
                    </div>

                    <!-- Content Container -->
                    <div class="w-full lg:w-1/2 flex flex-col">
                        <div
                            class="flex items-center space-x-2 text-sm text-brand-orange font-bold uppercase tracking-widest mb-4">
                            <span class="w-8 h-0.5 bg-brand-orange"></span>
                            <span>{{ post.author }}</span>
                        </div>

                        <a [routerLink]="['/blog', post.slug]" class="block group/title">
                            <h3
                                class="text-3xl lg:text-4xl font-extrabold text-brand-dark mb-6 group-hover/title:text-brand-purple transition-colors duration-300 leading-tight">
                                {{ post.title }}
                            </h3>
                        </a>

                        <p class="text-lg text-gray-600 leading-relaxed mb-8 text-justify">
                            {{ post.content }}
                        </p>

                        <div class="flex items-center justify-between border-t border-gray-100 pt-8">
                            <a [routerLink]="['/blog', post.slug]"
                                class="inline-flex items-center text-brand-dark font-bold hover:text-brand-orange transition-colors group/link text-lg">
                                Read Full Article
                                <svg class="ml-2 w-5 h-5 transition-transform duration-300 group-hover/link:translate-x-1"
                                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
                                </svg>
                            </a>

                            <!-- Share/Social Icons (Visual only) -->
                            <div
                                class="flex space-x-4 opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-100">
                                <button class="text-gray-400 hover:text-brand-purple transition-colors"><i
                                        class="fas fa-share-alt"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
