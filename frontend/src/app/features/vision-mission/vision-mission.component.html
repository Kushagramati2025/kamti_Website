<div class="min-h-screen bg-gray-50 font-sans">
    <!-- Compact Hero Banner -->
    <div class="relative w-full h-[220px] bg-gray-900 overflow-hidden group">
        <!-- Background Image -->
        <img src="assets/images/leadership/banner_new.png"
            class="absolute inset-0 w-full h-full object-cover object-center opacity-80 transition-transform duration-700 group-hover:scale-105"
            alt="Vision Mission Banner">
        <div class="absolute inset-0 bg-gradient-to-b from-brand-purple/60 via-brand-purple/40 to-brand-purple/90">
        </div>

        <!-- Content -->
        <div class="absolute inset-0 flex flex-col items-center justify-center z-10 pb-8">
            <h1
                class="text-3xl md:text-5xl font-bold text-white tracking-[0.2em] uppercase drop-shadow-2xl mb-4 animate-fade-in-up text-center">
                Vision & Mission
            </h1>
            <div class="w-16 h-1 bg-brand-orange rounded-full shadow-lg"></div>
        </div>

        <!-- Integrated Navigation -->
        <div class="absolute bottom-0 left-0 right-0 z-20 border-t border-white/10 bg-white/5 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4">
                <nav class="flex flex-wrap justify-center md:justify-between items-center h-auto md:h-12 py-1">
                    <div class="flex flex-wrap justify-center gap-1 md:gap-2">
                        <a routerLink="/leadership" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Leadership</a>
                        <a routerLink="/partners" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Partners</a>
                        <a routerLink="/values" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Values</a>
                        <a routerLink="/vision-mission" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Visionary</a>
                        <a routerLink="/blog" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Blog</a>
                        <a routerLink="/contact" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Contact</a>
                    </div>
                </nav>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="w-full">
            <div class="text-center mb-16">
                <h2 class="text-3xl font-bold text-gray-900 uppercase tracking-tight">Our Purpose</h2>
                <div class="w-24 h-1 bg-brand-orange mx-auto mt-4 rounded-full"></div>
            </div>

            <div *ngIf="loading" class="flex justify-center py-12">
                <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-brand-purple"></div>
            </div>

            <div *ngIf="!loading" class="space-y-12">
                <div *ngFor="let item of items; let i = index"
                    class="relative bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden transform hover:-translate-y-1 transition-all duration-500 group">

                    <!-- Top accent bar -->
                    <div class="h-2 w-full bg-gradient-to-r from-brand-purple to-brand-deep-purple"></div>

                    <div class="p-8 md:p-12 flex flex-col md:flex-row items-center md:items-start gap-8">
                        <!-- Icon Circle -->
                        <div class="flex-shrink-0">
                            <div
                                class="h-24 w-24 rounded-2xl bg-brand-purple/5 flex items-center justify-center text-brand-purple group-hover:bg-brand-orange group-hover:text-white transition-all duration-500 shadow-inner">
                                <svg *ngIf="i % 2 === 0" class="h-12 w-12" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <svg *ngIf="i % 2 !== 0" class="h-12 w-12" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                                </svg>
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="text-center md:text-left">
                            <h3
                                class="text-3xl font-bold text-gray-900 mb-4 uppercase tracking-wide group-hover:text-brand-purple transition-colors">
                                {{ item.type }}</h3>
                            <p class="text-lg text-gray-600 leading-relaxed max-w-4xl">{{ item.content }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
