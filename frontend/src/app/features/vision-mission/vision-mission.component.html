<div class="min-h-screen bg-gray-50 font-sans">
    <!-- Compact Hero Banner -->
    <!-- Compact Hero Banner -->
    <div class="relative w-full h-[180px] bg-gray-900 overflow-hidden group">
        <!-- Background Image -->
        <img src="assets/images/vision-mission/banner.png"
            class="absolute inset-0 w-full h-full object-cover object-center opacity-90 transition-transform duration-700 group-hover:scale-105"
            alt="Vision Mission Banner">
        <div class="absolute inset-0 bg-gradient-to-b from-brand-purple/40 to-brand-purple/70">
        </div>

        <!-- Integrated Navigation -->
        <div class="absolute bottom-0 left-0 right-0 z-20 border-t border-white/10 bg-white/5 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4">
                <nav class="flex flex-wrap justify-center md:justify-between items-center h-auto md:h-12 py-1">
                    <div class="flex flex-wrap justify-center gap-1 md:gap-2">
                        <a routerLink="/leadership" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Leadership</a>
                        <a routerLink="/partners" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Partners</a>
                        <a routerLink="/values" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Values</a>
                        <a routerLink="/vision-mission" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Vision
                            & Mission</a>
                        <a routerLink="/blog" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Blog</a>
                        <a routerLink="/contact" routerLinkActive="bg-brand-orange text-white"
                            class="px-3 py-1.5 rounded-full text-white/90 text-xs md:text-sm font-medium hover:bg-white/10 hover:text-white transition-all duration-300 uppercase tracking-wide">Contact</a>
                    </div>
                </nav>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 relative overflow-hidden">

        <!-- Decorative Background Blobs -->
        <div
            class="absolute top-10 left-0 w-72 h-72 bg-brand-purple/10 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob">
        </div>
        <div
            class="absolute bottom-10 right-0 w-72 h-72 bg-brand-orange/10 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000">
        </div>

        <div class="w-full relative z-10">
            <div class="text-center mb-20 opacity-0 animate-fade-in-up" style="animation-fill-mode: forwards;">
                <h2
                    class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-brand-purple to-brand-orange mb-6">
                    Driving The Future
                </h2>
                <div class="w-32 h-1.5 bg-gradient-to-r from-brand-purple to-brand-orange mx-auto rounded-full"></div>
                <p class="mt-8 text-xl text-gray-600 max-w-3xl mx-auto leading-relaxed">
                    At Kushagramati, our compass is set by a clear vision and a steadfast mission. We are redefining
                    what's possible in the world of data and analytics.
                </p>
            </div>

            <div *ngIf="loading" class="flex justify-center py-20">
                <div class="relative w-20 h-20">
                    <div class="absolute top-0 left-0 w-full h-full border-4 border-brand-purple/30 rounded-full"></div>
                    <div
                        class="absolute top-0 left-0 w-full h-full border-4 border-t-brand-purple rounded-full animate-spin">
                    </div>
                </div>
            </div>

            <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 gap-12 lg:gap-16 items-stretch">
                <ng-container *ngFor="let item of items; let i = index">
                    <!-- Dynamic Card -->
                    <div class="relative group perspective-1000 opacity-0 animate-fade-in-up"
                        [style.animation-delay]="(i * 200) + 'ms'" style="animation-fill-mode: forwards;">

                        <div
                            class="h-full bg-white rounded-[2rem] p-10 shadow-xl border border-gray-100 transition-all duration-500 transform group-hover:-translate-y-3 group-hover:shadow-2xl relative overflow-hidden">

                            <!-- Card Hover Gradient Background -->
                            <div class="absolute inset-0 bg-gradient-to-br opacity-0 group-hover:opacity-100 transition-opacity duration-500"
                                [ngClass]="item.type === 'Vision' ? 'from-brand-orange/5 to-white' : 'from-brand-purple/5 to-white'">
                            </div>

                            <!-- Icon Container -->
                            <div class="relative w-24 h-24 rounded-3xl flex items-center justify-center mb-10 shadow-lg transform group-hover:scale-110 transition-transform duration-500"
                                [ngClass]="item.type === 'Vision' ? 'bg-gradient-to-br from-brand-orange to-red-500 text-white' : 'bg-gradient-to-br from-brand-purple to-indigo-600 text-white'">

                                <!-- Vision Icon (Eye/Target) -->
                                <svg *ngIf="item.type === 'Vision'" class="w-12 h-12" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>

                                <!-- Mission Icon (Rocket/Flag) -->
                                <svg *ngIf="item.type !== 'Vision'" class="w-12 h-12" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                                </svg>
                            </div>

                            <!-- Content -->
                            <div class="relative">
                                <h3 class="text-3xl font-bold mb-6 uppercase tracking-wider"
                                    [ngClass]="item.type === 'Vision' ? 'text-brand-orange' : 'text-brand-purple'">
                                    {{ item.type }}
                                </h3>
                                <p class="text-gray-600 leading-8 text-lg text-justify">
                                    {{ item.content }}
                                </p>
                            </div>

                            <!-- Decorative Corner -->
                            <div class="absolute -bottom-10 -right-10 w-40 h-40 rounded-full opacity-10"
                                [ngClass]="item.type === 'Vision' ? 'bg-brand-orange' : 'bg-brand-purple'">
                            </div>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</div>
