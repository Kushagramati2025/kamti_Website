<div class="bg-gray-50 min-h-screen pt-16 pb-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Back Link -->
        <a routerLink="/tools-resources"
            class="inline-flex items-center text-brand-purple hover:text-brand-purple-dark mb-6 font-medium transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Tools & Resources
        </a>

        <div *ngIf="loading()" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-brand-purple mx-auto"></div>
            <p class="mt-4 text-gray-500">Loading case study details...</p>
        </div>

        <div *ngIf="study()" class="bg-white rounded-2xl shadow-xl overflow-hidden animate-fadeIn">
            <!-- Header/Banner -->
            <div class="bg-brand-purple/10 p-8 text-center border-b border-purple-100">
                <div class="w-16 h-16 bg-white rounded-xl shadow-sm flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-brand-purple" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">{{ study().title }}</h1>
            </div>

            <div class="p-8">
                <!-- Content -->
                <div class="prose prose-lg prose-brand max-w-none text-gray-600 space-y-6"
                    [innerHTML]="study().content || study().description">
                </div>

                <!-- CTA -->
                <div class="mt-10 pt-8 border-t border-gray-100 text-center">
                    <p class="text-gray-500 mb-6 font-medium">Interested in learning more about this case study?</p>
                    <a [href]="getMailToLink(study())"
                        class="inline-flex justify-center items-center rounded-xl shadow-lg px-8 py-4 bg-gradient-to-r from-brand-purple to-indigo-600 text-lg font-bold text-white hover:from-brand-purple-dark hover:to-indigo-700 focus:outline-none transform hover:scale-105 transition-all duration-300">
                        Request Info
                        <svg class="ml-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                            </path>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <div *ngIf="!loading() && !study()" class="text-center py-12">
            <p class="text-gray-500 text-lg">Case study not found.</p>
        </div>
    </div>
</div>
